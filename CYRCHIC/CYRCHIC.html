<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仅展示 PNG 图片</title>
  <style>
    /* 极简风格：只关注图片本身，无多余装饰 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #fafafa;  /* 柔和底色，突出图片 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    /* 图片容器：限制最大宽度，同时保持响应式 */
    .png-container {
      max-width: 100%;
      max-height: 95vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); /* 极淡阴影，几乎不可见，但增加一点层次 */
      border-radius: 8px;
      background-color: transparent; /* 完全透明，让 PNG 透明部分显示为底色 */
    }

    /* PNG 图片样式：保持原始比例，限制最大尺寸 */
    .png-container img {
      display: block;
      max-width: 100%;
      max-height: 95vh;
      width: auto;
      height: auto;
      border-radius: 4px; /* 轻微圆角，不破坏原图 */
    }
  </style>
</head>
<body>
  <div class="png-container">
    <!-- 
      这是唯一的内容：一个 PNG 图片。
      你可以将 src 替换为你自己的 PNG 文件路径或 URL。
      默认使用一个简单的透明 PNG 示例（一个蓝色半透明圆点），方便你看到效果。
      如果需要完全自定义，直接替换 src 即可，其余部分无需改动。
    -->
    <img 
      src="CYRCHIC/CYRCHIC.png" 
      alt="PNG图片"
      title="PNG图片"
    />
    <!-- 
      注意：上面的 base64 是一个 100x100 的透明 PNG（实际是一个蓝色半透明圆点）。
      它只是为了演示效果，你可以随意替换成你真正的 PNG 图片链接或本地路径。
      例如：src="your-image.png" 或 src="https://example.com/your-image.png"
    -->
  </div>
</body>
</html>
